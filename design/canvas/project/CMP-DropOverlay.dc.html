<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CMP-DropOverlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0B0812;font-family:'Manrope',system-ui,sans-serif}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#FFB870;--accentHover:#FFC995;--onAccent:#1A1005;--accent2:#A47BFF;--accent2Fg:#C3A8FF;--selection:#2A1D47;--selectionLine:#4A3580;--danger:#FF8595;--success:#5BD6A0;--scrim:#07050BB3;--chrome:#140F1EB8;--dangerBg:#3A1622;--warnBg:#33240F;--focus:#A47BFF;--workArea:#0B0812;--playhead:#FFB870;--trackClip:#3B2A55;--trackClipAlt:#47306A;--trackText:#5A3E1C;--trackAudio:#1F3B33;--waveform:#5BD6A0;--trackLabel:#EFEAF8;--handle:#EFEAF8;--previewOutline:#A47BFF;--previewHandle:#FFFFFF;--txt-white:#FFFFFF;--txt-black:#000000;--txt-red:#E5383B;--txt-orange:#F28C28;--txt-yellow:#FFD60A;--txt-green:#2DB84D;--txt-cyan:#1FC8E0;--txt-blue:#2F6FEB;--txt-purple:#8E44EC;--txt-pink:#F05BA8}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#A65305;--accentHover:#8F4705;--onAccent:#FFFFFF;--accent2:#6837E0;--accent2Fg:#5429C0;--selection:#F0EAFE;--selectionLine:#CDBBF8;--danger:#C0243B;--success:#13744C;--scrim:#16111F66;--chrome:#FFFFFFD1;--dangerBg:#FCE8EC;--warnBg:#FDEBD8;--focus:#6837E0;--workArea:#ECE8F4;--playhead:#A65305;--trackClip:#DCCFF7;--trackClipAlt:#CDBBF8;--trackText:#FBDDB8;--trackAudio:#CDEFE0;--waveform:#13744C;--trackLabel:#16111F;--handle:#16111F;--previewOutline:#6837E0;--previewHandle:#FFFFFF;--txt-white:#FFFFFF;--txt-black:#000000;--txt-red:#E5383B;--txt-orange:#F28C28;--txt-yellow:#FFD60A;--txt-green:#2DB84D;--txt-cyan:#1FC8E0;--txt-blue:#2F6FEB;--txt-purple:#8E44EC;--txt-pink:#F05BA8}
.cap{font:600 12px 'JetBrains Mono',monospace;color:#9C92B0;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{display:flex;flex-direction:column;gap:4px;min-width:0}
.ic{width:16px;height:16px;flex:none}
.ic20{width:20px;height:20px;flex:none}
.grow{flex:1}
.mono{font-family:'JetBrains Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.btn{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--fg);font:600 13px 'Manrope',sans-serif;box-sizing:border-box;white-space:nowrap;position:relative}
.btn.icon{width:32px;padding:0;color:var(--muted)}
.btn.q{color:var(--fg)}
.btn.out{border-color:var(--accent);color:var(--accent)}
.btn.dng{border-color:var(--danger);color:var(--danger)}
.btn.fill{background:var(--accent);color:var(--onAccent);font-weight:700}
.btn.off,.btn.fill.off{background:var(--surface2);border-color:var(--line);color:var(--muted);font-weight:600}
.btn.pressed{background:var(--surface2);border-color:var(--accent);color:var(--fg)}
.btn.hov{background:var(--surface2)}
.btn.t{height:44px;min-width:44px;font-size:14px}
.fr{outline:2px solid var(--focus);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--lineStrong);border-radius:10px;color:var(--fg);font-size:13px;line-height:1.55;box-sizing:border-box;overflow:hidden}
.hd{display:flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 16px;border-bottom:1px solid var(--line);flex:none}
.hd h2{margin:0;font:700 14px 'Manrope',sans-serif;flex:1;line-height:1.15}
.lbl{font:600 11px 'Manrope',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grab{width:32px;height:4px;border-radius:999px;background:var(--lineStrong);margin:8px auto 0;flex:none;display:block}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border:1px solid var(--lineStrong);border-bottom-width:2px;border-radius:7px;background:var(--surface2);color:var(--fg);font:500 12px 'JetBrains Mono',monospace}
a{color:inherit}
.sb{display:flex;align-items:center;gap:12px;height:28px;padding:0 8px;border-top:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:12px;box-sizing:border-box}
.sbb{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:500 12px 'Manrope',sans-serif;white-space:nowrap}
.sbb.open{background:var(--surface2);color:var(--fg)}
.sdot{width:8px;height:8px;border-radius:999px;background:var(--success);flex:none}
.srcl{display:inline-flex;align-items:center;gap:4px;color:var(--fg);text-decoration:underline;text-underline-offset:2px;font-size:12px;white-space:nowrap}
.facts{font:500 12px 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.sbn{display:flex;align-items:center;height:28px;padding:0 0 0 4px;border-top:1px solid var(--line);background:var(--bg);box-sizing:border-box;position:relative}
.sbn .sbb{height:28px;padding:0 4px;gap:4px;font-size:11px;position:relative;min-width:0}
.sbn .sbb .ic{color:var(--success)}
.sbn .sbb::after,.sbn .icl::after{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px}
.sbn .icl{position:relative;width:44px;height:28px;display:grid;place-items:center;color:var(--fg);flex:none}
.ntop{display:flex;align-items:center;gap:0;height:52px;padding:0 4px;border-bottom:1px solid var(--line);background:var(--surface);box-sizing:border-box;flex:none}
.ntop .btn.icon{width:44px;height:44px;color:var(--fg)}
.ntop .btn.icon[aria-disabled=true]{color:var(--muted)}
.ntop .btn.xp{height:44px;padding:0 16px;margin-right:4px;font-size:14px}
.ntabs{display:grid;grid-template-columns:repeat(5,1fr);height:56px;border-top:1px solid var(--line);background:var(--surface);flex:none}
.ntabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--muted);font:600 11px 'Manrope',sans-serif;padding:0 4px;white-space:nowrap;overflow:hidden}
.ntabs button.on{color:var(--accent)}
.ntabs button[aria-disabled=true]{color:var(--muted)}
.root{width:1240px;height:1200px;box-sizing:border-box;padding:16px;display:flex;gap:16px;background:#0B0812;overflow:hidden}
.colm{width:596px;display:flex;flex-direction:column;gap:8px;flex:none}
.cap{letter-spacing:0}
.phone{position:relative;width:390px;border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;background:var(--bg);color:var(--fg);overflow:hidden;display:flex;flex-direction:column;box-sizing:border-box}
.ed{position:relative;width:596px;height:420px;display:grid;grid-template-rows:40px minmax(0,1fr) 132px 28px;background:var(--bg);color:var(--fg);border:1px solid var(--line);box-sizing:border-box;overflow:hidden;font-size:13px}
.tb{display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.tb i{display:block;width:64px;height:12px;border-radius:999px;background:var(--surface2)}
.tb b{display:block;width:72px;height:28px;border-radius:7px;background:var(--accent)}
.stage{background:var(--workArea);display:grid;place-items:center}
.frame{width:92px;height:164px;background:linear-gradient(180deg,#F6A15E 0%,#E5735F 38%,#7B4A7C 64%,#2B3A63 100%)}
.tl{border-top:1px solid var(--line);background:var(--surface);padding:8px 12px 8px 40px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.lane{display:flex;gap:2px}
.clip{height:56px;border-radius:6px;background:var(--trackClip);flex:none}
.clip.alt{background:var(--trackClipAlt)}
.txl{height:24px;border-radius:5px;background:var(--trackText);flex:none}
.aud{height:28px;border-radius:5px;background:var(--trackAudio);flex:none}
.sbw{border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px}
.dot{width:8px;height:8px;border-radius:999px;background:var(--success)}
.ov{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;padding:12px;box-sizing:border-box;z-index:3}
.zone{width:100%;height:100%;box-sizing:border-box;border:2px dashed var(--accent);border-radius:10px;display:grid;place-items:center}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 32px;background:var(--surface);border:1px solid var(--lineStrong);border-radius:10px;color:var(--fg);text-align:center}
.card .ring{width:40px;height:40px;border-radius:999px;background:var(--surface2);display:grid;place-items:center;color:var(--accent)}
.card strong{font:700 17px 'Manrope',sans-serif}
.card span{font-size:13px;color:var(--muted)}
.phone .stage{flex:1;min-height:0}
.phone .frame{width:146px;height:260px}
.ptr{height:44px;background:var(--workArea);border-top:1px solid var(--line)}
.phone .tl{height:140px;box-sizing:border-box;padding:8px 0 8px 0;flex:none}
.phone .ov{border-radius:28px 28px 0 0}

</style>
</helmet>
<div class="root">

5-5 5M12 3v12"/></svg></span><strong data-copy="COPY-drop.hint">Drop to add</strong><span data-copy="COPY-drop.kinds">Videos, photos and audio</span></div></div></section></div></div>

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1240,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [ { cls: 'tk-dark', label: 'dark' }, { cls: 'tk-light', label: 'light' } ] };
  }
}
</script>
